<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
  .container{
    display: grid;
    margin-top: 40px;
    background-color: black;
    grid-template-areas:'box-0 box-0 box-0 box-0'
                        'box-1 box-2 box-3 box-4'
                        'box-5 box-6 box-7 box-8'
                        'box-9 box-10 box-11 box-8'
                        'box-12 box-13 box-14 box-8'
                        'box-15 box-16 box-17 box-8';
                      width: 400px;  
                      height: 400px;
                      padding: 30px;
                      border-radius: 50%;
                      gap:10px;
   
}
.box0{
    background-color: lightgreen;
    height: 80px;
}
.overall{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-top: 5%;
    /* padding: 200px; */
   
} 
.box8{
    background-color: lightcoral;
    border-radius: 10px;
}
.box1,.box2,.box3,.box4{
    background-color: gray;

}
.box0,.box1,.box2,.box3,.box4,.box5,.box6,.box7,.box9{
    border-radius: 10px;
}
.box10,.box11,.box12,.box13,.box14,.box15,.box16,.box17{
    border-radius: 10px;
}
button{
    font-size: 25px;
}
.main{
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
}
.box0{grid-area: box-0;}
 .box1{grid-area: box-1;} 
 .box2{grid-area: box-2;} 
 .box3{grid-area: box-3;} 
 .box4{grid-area: box-4;} 
 .box5{grid-area: box-5;} 
 .box6{grid-area: box-6;} 
 .box7{grid-area: box-7;} 
 .box8{grid-area: box-8;} 
 .box9{grid-area: box-9;} 
 .box10{grid-area: box-10;} 
 .box11{grid-area: box-11;} 
 .box12{grid-area: box-12;} 
 .box13{grid-area: box-13;} 
 .box14{grid-area: box-14;} 
 .box15{grid-area: box-15;} 
 .box16{grid-area: box-16;} 
 .box17{grid-area: box-17;} 
  
</style>
<body>
    <div class="overall" style= "border-radius: 30px;">
    <div class="main">CALCULATOR</div>
    <div class="container" style="border-radius: 15px;">
    <button class="box0" id="display" disabled></button>
    <button class="box1" onclick="appendToDisplay('+')">+</button>
    <button class="box2" onclick="appendToDisplay('-')">-</button>
    <button class="box3" onclick="appendToDisplay('*')">*</button>
    <button class="box4" onclick="appendToDisplay('/')">/</button> 
    <button class="box5" onclick="appendToDisplay('7')">7</button>
    <button class="box6" onclick="appendToDisplay('8')">8</button>
    <button class="box7" onclick="appendToDisplay('9')">9</button>
    <button class="box8" onclick="calculate()">=</button>
    <button class="box9" onclick="appendToDisplay('4')">4</button>
    <button class="box10" onclick="appendToDisplay('5')">5</button>
    <button class="box11" onclick="appendToDisplay('6')">6</button>
    <button class="box12" onclick="appendToDisplay('1')">1</button>
    <button class="box13" onclick="appendToDisplay('2')">2</button>
    <button class="box14" onclick="appendToDisplay('3')">3</button>
    <button class="box15" onclick="appendToDisplay('0')">0</button>
    <button class="box16" onclick="appendToDisplay('.')">.</button>
    <button class="box17" onclick="clearDisplay('Ac')">Ac</button>
    </div>
    </div>
<script>
    function appendToDisplay(value) {
    const display = document.getElementById('display');
    display.innerHTML += value;
}
function clearDisplay() {
    const display = document.getElementById('display');
    display.innerHTML = '';
}
function calculate(){
    const display = document.getElementById('display');
    try {
    const result = eval(display.innerHTML);
    display.innerHTML = result;
    } catch (error) {
    display.innerHTML = 'Error';
}
}
</script>
 </body>
</html>
